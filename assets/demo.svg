<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 890"
  font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .frame { fill: #1e1e1e; rx: 8; }
    .title-bar { fill: #2d2d2d; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .user-msg { fill: #264f78; rx: 8; }
    .bot-msg { fill: #2d2d2d; rx: 8; }
    .text { fill: #d4d4d4; font-size: 13px; }
    .text-bright { fill: #e8e8e8; font-size: 13px; font-weight: 600; }
    .text-dim { fill: #808080; font-size: 12px; }
    .text-blue { fill: #569cd6; font-size: 13px; }
    .text-green { fill: #6a9955; font-size: 13px; }
    .text-yellow { fill: #dcdcaa; font-size: 13px; }
    .text-orange { fill: #ce9178; font-size: 13px; }
    .text-cyan { fill: #4ec9b0; font-size: 13px; }
    .text-pink { fill: #c586c0; font-size: 13px; }
    .label { fill: #0078d4; rx: 4; }
    .label-text { fill: #ffffff; font-size: 11px; font-weight: 600; }
    .step1 { animation: fadeIn 0.5s ease-in 0.3s both; }
    .step2 { animation: fadeIn 0.5s ease-in 1.5s both; }
    .step3 { animation: fadeIn 0.5s ease-in 3.5s both; }
    .step4 { animation: fadeIn 0.5s ease-in 6.0s both; }
    .step5 { animation: fadeIn 0.5s ease-in 7.5s both; }
    .step6 { animation: fadeIn 0.5s ease-in 8.7s both; }
    .step7 { animation: fadeIn 0.5s ease-in 11.0s both; }
    .step8 { animation: fadeIn 0.5s ease-in 12.2s both; }
    .layer { fill: #252526; stroke: #808080; stroke-width: 1; }
  </style>

  <!-- Window Frame -->
  <rect class="frame" width="800" height="890" />

  <!-- Title Bar -->
  <rect class="title-bar" width="800" height="32" rx="8" />
  <rect class="title-bar" width="800" height="16" y="16" />
  <circle class="dot-red" cx="16" cy="16" r="6" />
  <circle class="dot-yellow" cx="36" cy="16" r="6" />
  <circle class="dot-green" cx="56" cy="16" r="6" />
  <text x="400" y="20" text-anchor="middle" class="text-dim">Copilot Chat — Study Agent</text>

  <!-- STEP 1: User resumes -->
  <g class="step1">
    <rect class="user-msg" x="560" y="46" width="220" height="32" />
    <text x="572" y="66" class="text-bright">resume demo</text>
    <rect class="label" x="710" y="52" width="58" height="20" />
    <text x="739" y="66" text-anchor="middle" class="label-text">You</text>
  </g>

  <!-- STEP 2: Session header with resume point -->
  <g class="step2">
    <rect class="bot-msg" x="20" y="90" width="600" height="150" />
    <rect class="label" x="24" y="96" width="84" height="20" fill="#6f42c1" />
    <text x="66" y="110" text-anchor="middle" class="label-text">Study Agent</text>
    <text x="36" y="136" class="text-green">▶ SESSION — AI Engineering Fundamentals</text>
    <line x1="36" y1="148" x2="600" y2="148" stroke="#808080" />
    <text x="36" y="168" class="text">Progress</text>
    <text x="130" y="168" class="text">0/5 (0%)</text>
    <text x="36" y="188" class="text">Resume at</text>
    <text x="130" y="188" class="text">1.1 The AI Engineering Stack — start</text>
    <line x1="36" y1="200" x2="600" y2="200" stroke="#808080" />
    <text x="36" y="226" class="text-blue">Continue from 1.1, or read a 2-minute summary first?</text>
  </g>

  <!-- STEP 3: Source-grounded teaching block -->
  <g class="step3">
    <rect class="bot-msg" x="20" y="250" width="760" height="232" />
    <text x="36" y="272" class="text-yellow">🎯 Why it matters</text>
    <text x="36" y="290" class="text">Most value comes from the application and data layers, not the
      model itself:</text>
    <text x="36" y="306" class="text">"The model is a commodity." <tspan class="text-dim">(§ 1. The
      AI Engineering Stack)</tspan></text>
    <text x="36" y="330" class="text-yellow">📌 The AI Engineering Stack</text>
    <rect class="layer" x="60" y="340" width="150" height="30" />
    <text x="135" y="360" text-anchor="middle" class="text">Application</text>
    <text x="226" y="360" class="text-dim">← UI, APIs, orchestration</text>
    <rect class="layer" x="60" y="372" width="150" height="30" />
    <text x="135" y="392" text-anchor="middle" class="text">Model</text>
    <text x="226" y="392" class="text-dim">← foundation models, fine-tuned models</text>
    <rect class="layer" x="60" y="404" width="150" height="30" />
    <text x="135" y="424" text-anchor="middle" class="text">Data &amp; Infra</text>
    <text x="226" y="424" class="text-dim">← vector DBs, pipelines, evaluation</text>
    <text x="36" y="464" class="text-cyan">🧠 Mental model: the model is the engine; you still have
      to build the car.</text>
  </g>

  <!-- STEP 4: Checkpoint after the unit -->
  <g class="step4">
    <rect class="bot-msg" x="20" y="490" width="760" height="30" />
    <text x="36" y="510" class="text-green">✓ Saved — 1/5 (20%) · Next: 1.2 Foundation Models and
      Prompting — continue?</text>
  </g>

  <!-- STEP 5: User asks the material -->
  <g class="step5">
    <rect class="user-msg" x="420" y="532" width="360" height="32" />
    <text x="432" y="552" class="text-bright">how big should RAG chunks be?</text>
    <rect class="label" x="710" y="538" width="58" height="20" />
    <text x="739" y="552" text-anchor="middle" class="label-text">You</text>
  </g>

  <!-- STEP 6: Cited answer from the source -->
  <g class="step6">
    <rect class="bot-msg" x="20" y="576" width="760" height="96" />
    <rect class="label" x="24" y="582" width="84" height="20" fill="#6f42c1" />
    <text x="66" y="596" text-anchor="middle" class="label-text">Study Agent</text>
    <text x="36" y="622" class="text">The article suggests 200–500 tokens per chunk. Too small loses
      context;</text>
    <text x="36" y="640" class="text">too large lets noise drown the signal.</text>
    <text x="36" y="660" class="text-dim">(§ 3. Retrieval-Augmented Generation: How RAG works, Key
      trade-offs) · Read more: 1.3</text>
  </g>

  <!-- STEP 7: User stops -->
  <g class="step7">
    <rect class="user-msg" x="560" y="684" width="220" height="32" />
    <text x="572" y="704" class="text-bright">done for today</text>
    <rect class="label" x="710" y="690" width="58" height="20" />
    <text x="739" y="704" text-anchor="middle" class="label-text">You</text>
  </g>

  <!-- STEP 8: Session saved with the exact resume point -->
  <g class="step8">
    <rect class="bot-msg" x="20" y="728" width="600" height="150" />
    <rect class="label" x="24" y="734" width="84" height="20" fill="#6f42c1" />
    <text x="66" y="748" text-anchor="middle" class="label-text">Study Agent</text>
    <text x="36" y="774" class="text-green">✓ SESSION SAVED — AI Engineering Fundamentals</text>
    <line x1="36" y1="786" x2="600" y2="786" stroke="#808080" />
    <text x="36" y="806" class="text">Covered</text>
    <text x="150" y="806" class="text">1.1 The AI Engineering Stack</text>
    <text x="36" y="826" class="text">Progress</text>
    <text x="150" y="826" class="text">1/5 (20%)</text>
    <text x="36" y="846" class="text-blue">Resume at</text>
    <text x="150" y="846" class="text-blue">1.2 — § 2. Foundation Models and Prompting</text>
    <text x="36" y="868" class="text-dim">Next time, just say "resume".</text>
  </g>
</svg>