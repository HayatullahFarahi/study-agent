<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 910"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .frame { fill: #1e1e1e; rx: 8; }
    .title-bar { fill: #2d2d2d; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .user-msg { fill: #264f78; rx: 8; }
    .bot-msg { fill: #2d2d2d; rx: 8; }
    .picker { fill: #3c3c3c; stroke: #0078d4; stroke-width: 1; rx: 6; }
    .chip { fill: #252526; stroke: #0078d4; stroke-width: 1; rx: 14; }
    .text { fill: #d4d4d4; font-size: 13px; }
    .text-bright { fill: #e8e8e8; font-size: 13px; font-weight: 600; }
    .text-dim { fill: #808080; font-size: 12px; }
    .text-blue { fill: #569cd6; font-size: 13px; }
    .text-green { fill: #6a9955; font-size: 13px; }
    .text-yellow { fill: #dcdcaa; font-size: 13px; }
    .label { fill: #0078d4; rx: 4; }
    .label-agent { fill: #6f42c1; rx: 4; }
    .label-text { fill: #ffffff; font-size: 11px; font-weight: 600; }
    .step1 { animation: fadeIn 0.5s ease-in 0.8s both; }
    .step2 { animation: fadeIn 0.5s ease-in 1.8s both; }
    .step3 { animation: fadeIn 0.5s ease-in 3.8s both; }
    .step4 { animation: fadeIn 0.5s ease-in 5.0s both; }
    .step5 { animation: fadeIn 0.5s ease-in 8.0s both; }
    .step6 { animation: fadeIn 0.5s ease-in 9.0s both; }
    .step7 { animation: fadeIn 0.5s ease-in 11.5s both; }
    .step8 { animation: fadeIn 0.5s ease-in 12.5s both; }
  </style>

    <!-- Window Frame -->
    <rect class="frame" width="800" height="910" />

    <!-- Title Bar -->
    <rect class="title-bar" width="800" height="32" rx="8" />
    <rect class="title-bar" width="800" height="16" y="16" />
    <circle class="dot-red" cx="16" cy="16" r="6" />
    <circle class="dot-yellow" cx="36" cy="16" r="6" />
    <circle class="dot-green" cx="56" cy="16" r="6" />
    <text x="400" y="20" text-anchor="middle" class="text-dim">Copilot Chat — Getting started</text>

    <!-- STEP 0: Agent picker -->
    <rect class="picker" x="20" y="42" width="190" height="26" />
    <text x="32" y="60" class="text-dim">Agent:</text>
    <text x="76" y="60" class="text-bright">Study Agent ▾</text>
    <text x="224" y="60" class="text-dim">← pick it once in the agent picker</text>

    <!-- STEP 1: User says hi -->
    <g class="step1">
        <rect class="user-msg" x="640" y="80" width="140" height="32" />
        <text x="652" y="100" class="text-bright">hi</text>
        <rect class="label" x="710" y="86" width="58" height="20" />
        <text x="739" y="100" text-anchor="middle" class="label-text">You</text>
    </g>

    <!-- STEP 2: Onboarding -->
    <g class="step2">
        <rect class="bot-msg" x="20" y="124" width="660" height="92" />
        <rect class="label-agent" x="24" y="130" width="84" height="20" />
        <text x="66" y="144" text-anchor="middle" class="label-text">Study Agent</text>
        <text x="36" y="170" class="text">No materials yet. I can study PDFs, books, slide decks,
            long videos, YouTube,</text>
        <text x="36" y="188" class="text">articles, and course folders with you, and remember
            exactly where you stop.</text>
        <text x="36" y="206" class="text-blue">Give me a file, folder, or link, or say "resume demo"
            to try the demo.</text>
    </g>

    <!-- STEP 3: User adds a material -->
    <g class="step3">
        <rect class="user-msg" x="460" y="228" width="320" height="32" />
        <text x="472" y="248" class="text-bright">add ~/Downloads/ddia.pdf</text>
        <rect class="label" x="710" y="234" width="58" height="20" />
        <text x="739" y="248" text-anchor="middle" class="label-text">You</text>
    </g>

    <!-- STEP 4: Extraction + detected structure -->
    <g class="step4">
        <rect class="bot-msg" x="20" y="272" width="760" height="184" />
        <rect class="label-agent" x="24" y="278" width="84" height="20" />
        <text x="66" y="292" text-anchor="middle" class="label-text">Study Agent</text>
        <text x="36" y="318" class="text-dim">Extracting text and structure (pypdf)…</text>
        <text x="36" y="340" class="text-green">Detected 12 chapters · 47 sections from the PDF
            bookmarks</text>
        <text x="36" y="358" class="text-dim">Skipped: Cover, Contents, Index</text>
        <text x="36" y="382" class="text">ch-1</text>
        <text x="84" y="382" class="text">Reliable, Scalable, and Maintainable Applications</text>
        <text x="500" y="382" class="text-dim">pp. 21-44</text>
        <text x="600" y="382" class="text-dim">5 sections</text>
        <text x="36" y="400" class="text">ch-2</text>
        <text x="84" y="400" class="text">Data Models and Query Languages</text>
        <text x="500" y="400" class="text-dim">pp. 45-86</text>
        <text x="600" y="400" class="text-dim">6 sections</text>
        <text x="36" y="418" class="text">ch-3</text>
        <text x="84" y="418" class="text">Storage and Retrieval</text>
        <text x="500" y="418" class="text-dim">pp. 87-128</text>
        <text x="600" y="418" class="text-dim">4 sections</text>
        <text x="84" y="434" class="text-dim">…</text>
        <text x="36" y="448" class="text-blue">Keep this structure, or edit it (rename, merge, drop,
            split)?</text>
    </g>

    <!-- STEP 5: User confirms -->
    <g class="step5">
        <rect class="user-msg" x="620" y="468" width="160" height="32" />
        <text x="632" y="488" class="text-bright">keep it</text>
        <rect class="label" x="710" y="474" width="58" height="20" />
        <text x="739" y="488" text-anchor="middle" class="label-text">You</text>
    </g>

    <!-- STEP 6: Registered + how to start -->
    <g class="step6">
        <rect class="bot-msg" x="20" y="512" width="760" height="130" />
        <rect class="label-agent" x="24" y="518" width="84" height="20" />
        <text x="66" y="532" text-anchor="middle" class="label-text">Study Agent</text>
        <text x="36" y="558" class="text-green">✓ Registered: Designing Data-Intensive Applications
            (book · pdf)</text>
        <text x="36" y="578" class="text">47 units · progress tracker and one-page overview created</text>
        <text x="36" y="600" class="text">How do you want to start?</text>
        <rect class="chip" x="36" y="610" width="180" height="26" />
        <text x="126" y="628" text-anchor="middle" class="text">▶ Start chapter 1</text>
        <rect class="chip" x="228" y="610" width="230" height="26" />
        <text x="343" y="628" text-anchor="middle" class="text">🗺️ Map the whole book first</text>
        <rect class="chip" x="470" y="610" width="230" height="26" />
        <text x="585" y="628" text-anchor="middle" class="text">⚡ Read a summary of chapter 1</text>
    </g>

    <!-- STEP 7: User starts -->
    <g class="step7">
        <rect class="user-msg" x="560" y="654" width="220" height="32" />
        <text x="572" y="674" class="text-bright">start chapter 1</text>
        <rect class="label" x="710" y="660" width="58" height="20" />
        <text x="739" y="674" text-anchor="middle" class="label-text">You</text>
    </g>

    <!-- STEP 8: First session begins -->
    <g class="step8">
        <rect class="bot-msg" x="20" y="698" width="760" height="200" />
        <rect class="label-agent" x="24" y="704" width="84" height="20" />
        <text x="66" y="718" text-anchor="middle" class="label-text">Study Agent</text>
        <text x="36" y="744" class="text-green">▶ SESSION — Designing Data-Intensive Applications</text>
        <line x1="36" y1="756" x2="760" y2="756" stroke="#808080" />
        <text x="36" y="776" class="text">Progress</text>
        <text x="130" y="776" class="text">0/47 (0%)</text>
        <text x="36" y="796" class="text">Resume at</text>
        <text x="130" y="796" class="text">1.1 Thinking About Data Systems — p. 21</text>
        <line x1="36" y1="808" x2="760" y2="808" stroke="#808080" />
        <text x="36" y="832" class="text-yellow">🎯 Why it matters</text>
        <text x="36" y="850" class="text">Many applications today are data-intensive rather than
            compute-intensive: the</text>
        <text x="36" y="868" class="text">harder problems are the amount, complexity, and rate of
            change of data. <tspan class="text-dim">(p. 21)</tspan></text>
        <text x="36" y="888" class="text-dim">One concept at a time, with citations · progress saved
            after every unit · say "done for today" to stop</text>
    </g>
</svg>